modLoader="javafml"
loaderVersion="[36,)"
license="MIT"

[[mods]]
modId="aoaagriculture"
version="${version}"
displayName="AoA Agriculture"
authors="Posatasa"
description='''
Adds a farmland block for every dirt-type block Advent of Ascension 3 adds to forge:dirt, so hoes
work on AoA soil the same way they work on vanilla dirt, plus the fertilised counterpart AoA's
farming system expects for each of them.

Each farmland behaves like vanilla farmland (same moisture and trampling rules, same three ways of
reverting), drops its own AoA soil when broken, and uses the vanilla farmland pattern in that
soil's colour.
'''

[[dependencies.aoaagriculture]]
    modId="forge"
    mandatory=true
    versionRange="[36,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.aoaagriculture]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.16.5,1.17)"
    ordering="NONE"
    side="BOTH"

[[dependencies.aoaagriculture]]
    modId="aoa3"
    mandatory=true
    # AoA versions the whole build, so the mod version literally reads "1.16.5-3.6.11" and the
    # "1.16.5-" prefix cannot be dropped: version comparison walks the components left to right,
    # so a range such as "[3.6.11,)" would start at 3 and sort "1.16.5-3.6.11" *below* it, and
    # the dependency would silently never be satisfied. The upper bound keeps this add-on off
    # AoA versions whose block registry it has not been checked against.
    versionRange="[1.16.5-3.6.11,1.16.5-3.7.0)"
    ordering="AFTER"
    side="BOTH"
